apiVersion: v1
kind: Secret
metadata:
  name: agency-os-secrets
  namespace: agency-os-staging
type: Opaque
stringData:
  OPENAI_API_KEY: replace-me
  MONGODB_URI: mongodb+srv://replace-me
  MONGODB_DATABASE: agency_os_staging
  AGENCY_SECRET_ENCRYPTION_KEY: replace-with-base64-32-byte-key
  AGENCY_REMOTE_SANDBOX_HMAC_SECRET: replace-with-at-least-32-random-characters
  AGENCY_PROVENANCE_HMAC_SECRET: replace-with-at-least-32-random-characters
  AGENCY_BOOTSTRAP_OWNER_TOKEN: replace-with-at-least-32-random-characters
  OTEL_EXPORTER_OTLP_HEADERS: ""
