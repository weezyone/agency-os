apiVersion: v1
kind: Namespace
metadata:
  name: agency-os-staging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agency-os-config
  namespace: agency-os-staging
data:
  NODE_ENV: production
  APP_URL: https://agency-os-staging.example.com
  AGENCY_AUTH_MODE: database
  AGENCY_OIDC_ALLOWED_ISSUER_HOSTS: login.example.com
  AGENCY_OIDC_REQUIRE_VERIFIED_EMAIL: "true"
  AGENCY_ALLOW_GLOBAL_INTEGRATION_FALLBACK: "false"
  AGENCY_TENANT_ID: agency-bootstrap
  AGENCY_TRANSACTIONS_REQUIRED: "true"
  AGENCY_ARTIFACT_PROVIDER: s3
  AGENCY_S3_REGION: us-east-1
  AGENCY_S3_BUCKET: replace-agency-os-staging
  AGENCY_S3_PREFIX: staging
  AGENCY_WORKSPACE_PROVIDER: remote-http
  AGENCY_REMOTE_SANDBOX_URL: https://sandbox-staging.example.com
  AGENCY_REMOTE_SANDBOX_AUDIENCE: agency-os-staging
  AGENCY_RUNNER_REGION: staging-us-east
  AGENCY_RUNNER_RESOURCE_CLASSES: standard
  AGENCY_ADMISSION_MAX_GLOBAL_READY_JOBS: "1000"
  AGENCY_ADMISSION_MAX_GLOBAL_ACTIVE_JOBS: "100"
  AGENCY_PROVENANCE_KEY_ID: agency-os-staging-v1
  AGENCY_OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: agency-os
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  AGENCY_OTEL_SAMPLE_RATIO: "0.25"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agency-os
  namespace: agency-os-staging
---
apiVersion: v1
kind: Service
metadata:
  name: agency-os-web
  namespace: agency-os-staging
spec:
  selector:
    app.kubernetes.io/name: agency-os
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-os-web
  namespace: agency-os-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agency-os
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agency-os
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: agency-os
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/replace-me/agency-os-web:0.7.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: agency-os-config
            - secretRef:
                name: agency-os-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-os-runner-artifact
  namespace: agency-os-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agency-os
      app.kubernetes.io/component: runner-artifact
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agency-os
        app.kubernetes.io/component: runner-artifact
    spec:
      serviceAccountName: agency-os
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/replace-me/agency-os-runner:0.7.0
          envFrom:
            - configMapRef:
                name: agency-os-config
            - secretRef:
                name: agency-os-secrets
          env:
            - name: AGENCY_RUNNER_QUEUES
              value: artifact,events
            - name: AGENCY_RUNNER_LABELS
              value: artifact,node22
            - name: AGENCY_RUNNER_CONCURRENCY
              value: "2"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspaces
              mountPath: /var/lib/agency-os/workspaces
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspaces
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-os-runner-workspace
  namespace: agency-os-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agency-os
      app.kubernetes.io/component: runner-workspace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agency-os
        app.kubernetes.io/component: runner-workspace
    spec:
      serviceAccountName: agency-os
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/replace-me/agency-os-runner:0.7.0
          envFrom:
            - configMapRef:
                name: agency-os-config
            - secretRef:
                name: agency-os-secrets
          env:
            - name: AGENCY_RUNNER_QUEUES
              value: workspace
            - name: AGENCY_RUNNER_LABELS
              value: remote-sandbox,client-safe
            - name: AGENCY_RUNNER_CONCURRENCY
              value: "2"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspaces
              mountPath: /var/lib/agency-os/workspaces
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspaces
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-os-runner-external
  namespace: agency-os-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agency-os
      app.kubernetes.io/component: runner-external
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agency-os
        app.kubernetes.io/component: runner-external
    spec:
      serviceAccountName: agency-os
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/replace-me/agency-os-runner:0.7.0
          envFrom:
            - configMapRef:
                name: agency-os-config
            - secretRef:
                name: agency-os-secrets
          env:
            - name: AGENCY_RUNNER_QUEUES
              value: external-actions
            - name: AGENCY_RUNNER_LABELS
              value: integrations
            - name: AGENCY_RUNNER_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspaces
              mountPath: /var/lib/agency-os/workspaces
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspaces
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agency-os-web
  namespace: agency-os-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agency-os-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agency-os-runner-workspace
  namespace: agency-os-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agency-os-runner-workspace
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
